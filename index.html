<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YEAT TRACKER</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --card-bg: #141418;
      --accent: #9040ff;
      --text: #ececef;
      --text-muted: #8e8e99;
      --border: #22222a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; padding: 30px 0; border-bottom: 1px solid var(--border); }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
    p.subtitle { color: var(--text-muted); margin-top: 5px; font-size: 0.9rem; }

    nav { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .section-content { display: none; }
    .section-content.active { display: block; }

    .search-bar { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 0.9rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { font-size: 1rem; margin-bottom: 8px; line-height: 1.3; }
    .card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }
    .card a {
      display: inline-block;
      text-align: center;
      background: #1f1f27;
      color: var(--text);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .card a:hover { border-color: var(--accent); color: var(--accent); }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; font-size: 0.85rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { background: #1a1a20; color: var(--accent); font-weight: 700; position: sticky; top: 0; }
    tr:hover { background: #181820; }
    
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>YEAT TRACKER</h1>
    <p class="subtitle">AUTOMATED LEAKS, SOCIAL MEDIA & ARTIST TRACKER</p>
  </header>

  <nav>
    <button class="tab-btn active" onclick="switchTab('sheet')">Artist Tracker</button>
    <button class="tab-btn" onclick="switchTab('surfaced')">Recently Surfaced</button>
    <button class="tab-btn" onclick="switchTab('socials')">Socials</button>
  </nav>

  <!-- Google Sheet Section -->
  <div id="sheet" class="section-content active">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search songs, eras, leaks..." onkeyup="filterTable()">
    <div style="overflow-x:auto; max-height: 600px;">
      <table>
        <thead>
          <tr id="sheet-header"></tr>
        </thead>
        <tbody id="sheet-body">
          <tr><td colspan="5" class="loading">Loading Google Sheet data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Recently Surfaced Section -->
  <div id="surfaced" class="section-content">
    <div id="surfaced-container" class="grid"><div class="loading">Loading leaks...</div></div>
  </div>

  <!-- Socials Section -->
  <div id="socials" class="section-content">
    <div id="socials-container" class="grid"><div class="loading">Loading social posts...</div></div>
  </div>

  <script>
    let sheetData = [];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // Load Google Sheet Tracker
    fetch('data/google_sheet_tracker.json')
      .then(res => res.json())
      .then(data => {
        sheetData = data;
        if (!data || data.length === 0) return;
        
        const keys = ["Era", "Name", "Type", "Quality", "Leak Date", "SheetSource"];
        document.getElementById('sheet-header').innerHTML = keys.map(k => `<th>${k}</th>`).join('');
        renderTable(sheetData);
      }).catch(() => {
        document.getElementById('sheet-body').innerHTML = '<tr><td colspan="5" class="loading">Failed to load tracker data.</td></tr>';
      });

    function renderTable(data) {
      const tbody = document.getElementById('sheet-body');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="loading">No matching songs found.</td></tr>';
        return;
      }
      tbody.innerHTML = data.slice(0, 300).map(row => `
        <tr>
          <td>${row["Era"] || '-'}</td>
          <td>${row["Name"] || '-'}</td>
          <td>${row["Type"] || '-'}</td>
          <td>${row["Quality"] || '-'}</td>
          <td>${row["Leak Date"] || row["Date"] || '-'}</td>
          <td>${row["SheetSource"] || '-'}</td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = sheetData.filter(row => {
        return Object.values(row).some(val => String(val).toLowerCase().includes(query));
      });
      renderTable(filtered);
    }

    // Load Recently Surfaced
    fetch('data/recently_surfaced.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('surfaced-container');
        if (!data || data.length === 0) {
          container.innerHTML = '<p class="loading">No recent leaks found.</p>';
          return;
        }
        container.innerHTML = data.map(item => `
          <div class="card">
            <div>
              <h3>${item.title || 'Untitled Leak'}</h3>
              <p>Surfaced: ${item.date_surfaced ? new Date(item.date_surfaced).toLocaleDateString() : 'N/A'}</p>
            </div>
            <a href="${item.url}" target="_blank">View on Leaked.cx</a>
          </div>
        `).join('');
      });

    // Load Social Posts
    fetch('data/social_posts.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('socials-container');
        if (!data || data.length === 0) {
          container.innerHTML = '<p class="loading">No recent social posts found.</p>';
          return;
        }
        container.innerHTML = data.map(post => `
          <div class="card">
            <div>
              <h3>${post.title}</h3>
              <p>Published: ${new Date(post.published_at).toLocaleDateString()}</p>
            </div>
            <a href="${post.url}" target="_blank">Watch on ${post.platform}</a>
          </div>
        `).join('');
      });
  </script>

</body>
</html>
