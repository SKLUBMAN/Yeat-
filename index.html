  <style>
    :root {
      --bg: #0b0b0d;
      --card-bg: #141418;
      --accent: #9040ff;
      --text: #ececef;
      --text-muted: #8e8e99;
      --border: #22222a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto; }
    
    header { text-align: center; padding: 30px 0; border-bottom: 1px solid var(--border); }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
    p.subtitle { color: var(--text-muted); margin-top: 5px; font-size: 0.9rem; }

    nav { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .section-content { display: none; }
    .section-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { font-size: 1rem; margin-bottom: 8px; line-height: 1.3; }
    .card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }

      text-align: center;
      background: #1f1f27;

      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
