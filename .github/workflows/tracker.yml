name: Yeat All-In-One Tracker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Run Recently Surfaced Scraper (leaked.cx)
      run: python scrape_leaked.py

    - name: Run Social Media Tracker
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: python track_socials.py

    - name: Run Google Sheet Artist Tracker
      run: python track_sheet.py

    - name: Commit and Push Updated JSON Data Feeds
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git commit -m "Auto-update all Yeat tracker data feeds" || exit 0
        git push
